<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABAGHANE STOCK PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f3;color:#18251d;font-family:Arial,sans-serif}
header{background:#123d2b;color:white;padding:25px 18px;border-radius:0 0 25px 25px}
.brand{font-size:22px;font-weight:bold;color:#d8b65b}
header p{color:#d5e5da;margin-bottom:0}
main{padding:16px;max-width:650px;margin:auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-5px}
.stat,.panel{background:white;border-radius:15px;padding:16px;box-shadow:0 3px 12px #0000000b}
.stat small{color:#718078}
.stat strong{display:block;font-size:21px;margin-top:9px;color:#17633e}
.panel{margin-top:15px}
h3{margin:0 0 15px}
input,select{width:100%;padding:13px;border:1px solid #dce5de;border-radius:10px;margin:6px 0 12px;font-size:15px;background:white}
button{border:0;border-radius:10px;padding:13px;background:#17633e;color:white;font-size:15px;font-weight:bold;width:100%;cursor:pointer}
button.secondary{background:#e8f1eb;color:#17633e}
.product{border-bottom:1px solid #edf0ed;padding:13px 0}
.product:last-child{border:0}
.product b{display:block;font-size:16px}
.product small{color:#718078;display:block;margin-top:6px}
.price{color:#17633e;font-weight:bold;margin-top:7px}
.delete{background:#fae9e7;color:#b33c30;width:auto;padding:7px 12px;margin-top:8px}
</style>
</head>
<body>
<header>
<div class="brand">ABAGHANE STOCK PRO</div>
<p>نظام احترافي لتدبير وجرد المخزون</p>
</header>
<main>
<div class="stats">
<div class="stat"><small>عدد أنواع السلع</small><strong id="count">0</strong></div>
<div class="stat"><small>قيمة المخزون (DH)</small><strong id="total">0.00</strong></div>
</div>

<section class="panel">
<h3>＋ إضافة سلعة جديدة</h3>
<input id="barcode" placeholder="الباركود (يمكن استعمال السكانير)">
<input id="name" placeholder="اسم السلعة">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div>
<label>الكمية</label>
<input id="qty" type="number" step="0.01" placeholder="0">
</div>
<div>
<label>وحدة القياس</label>
<select id="unit">
<option>قطعة</option><option>كرتونة</option><option>KG</option>
</select>
</div>
</div>
<label>ثمن الشراء للوحدة (DH)</label>
<input id="price" type="number" step="0.01" placeholder="0.00">
<button onclick="addProduct()">حفظ السلعة</button>
</section>

<section class="panel">
<h3>📦 لائحة المخزون</h3>
<input id="search" placeholder="بحث بالاسم أو الباركود..." oninput="render()">
<div id="products"></div>
</section>
<p style="text-align:center;color:#829087;font-size:12px">ABAGHANE FOOD © ABAGHANE INVENTAIRE PRO</p>
</main>
<script>
let items=JSON.parse(localStorage.getItem("abaghane_stock")||"[]");
function save(){localStorage.setItem("abaghane_stock",JSON.stringify(items));render()}
function addProduct(){
let barcode=document.getElementById("barcode").value.trim();
let name=document.getElementById("name").value.trim();
let qty=Number(document.getElementById("qty").value);
let unit=document.getElementById("unit").value;
let price=Number(document.getElementById("price").value);
if(!name||qty<=0||price<0){alert("دخل اسم السلعة والكمية والثمن بشكل صحيح");return}
let old=items.find(x=>barcode&&x.barcode===barcode);
if(old){old.qty+=qty;old.price=price}
else items.push({barcode,name,qty,unit,price});
["barcode","name","qty","price"].forEach(id=>document.getElementById(id).value="");
save();
}
function removeItem(i){if(confirm("واش متأكد من حذف هاد السلعة؟")){items.splice(i,1);save()}}
function render(){
let q=document.getElementById("search").value.toLowerCase();
let filtered=items.filter(x=>x.name.toLowerCase().includes(q)||(x.barcode||"").includes(q));
document.getElementById("count").textContent=items.length;
document.getElementById("total").textContent=items.reduce((s,x)=>s+x.qty*x.price,0).toFixed(2);
document.getElementById("products").innerHTML=filtered.length?filtered.map(x=>{
let i=items.indexOf(x);
return `<div class="product"><b>${x.name}</b><small>الباركود: ${x.barcode||"غير متوفر"} | الكمية: ${x.qty} ${x.unit}</small><div class="price">${(x.qty*x.price).toFixed(2)} DH</div><small>ثمن الشراء: ${x.price} DH</small><button class="delete" onclick="removeItem(${i})">حذف</button></div>`
}).join(""):"<p style='color:#89958e;text-align:center'>مازال ما كايناش سلع فالمخزون</p>";
}
document.getElementById("barcode").addEventListener("keydown",e=>{
if(e.key==="Enter"){
let code=e.target.value.trim();
let found=items.find(x=>x.barcode===code&&code);
if(found){found.qty+=1;save();e.target.value="";alert("تزادت وحدة من: "+found.name)}
else document.getElementById("name").focus();
}
});
render();
</script>
</body>
</html>
